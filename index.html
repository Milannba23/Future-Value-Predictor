<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Value Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-overlay">
        
        <h1>Future Value Predictor</h1>

        <div class="container">
            <div class="input-group">
                <h3>
                    Expected annual inflation:
                    <input type="number" step="0.1" min="0" id="inflationRate" placeholder="0"> %
                </h3>
            </div>

            <div class="input-group">
                <h3>
                    Calculate the future impact on 
                    <input type="number" min="1" id="money" placeholder="Amount"> 
                </h3>
            </div>

            <div class="input-group">
                <h3>
                    Currency:
                    <select id="currency">
                        <option value="€">EUR (€) - Euro</option>
                        <option value="$">USD ($) - US Dollar</option>
                        <option value="RSD">RSD (din) - Serbian Dinar</option>
                        <option value="GBP">GBP (£) - British Pound</option>
                        <option value="CHF">CHF (₣) - Swiss Franc</option>
                        <option value="CNY">CNY (¥) - Chinese Yuan</option>
                        <option value="AED">AED (د.إ) - Arab Emirate Dirham</option>
                        <option value="INR">INR (₹) - Indian Rupee</option>
                        <option value="SEK">SEK (kr) - Swedish Krona</option>
                        <option value="AUD">AUD ($) - Australian Dollar</option>
                    </select>
                </h3>
            </div>

            <div class="input-group">
                <h3>
                    Period of investment:
                    <input type="number" min="1" id="years" placeholder="0"> years.
                </h3>
            </div>

            <div class="button-group">
                <button class="main-btn" onclick="inflationCalculator()">Analyze Purchasing Power</button>
                <button class="reset-btn" onclick="resetFields()">Clear All</button>
            </div>

            <div class="new-value" id="result"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
